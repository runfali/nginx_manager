{% extends "base.html" %}

{% block title %}编辑用户 - {{ user.username }}{% endblock %}

{% block content %}
<div class="container">
    <div class="row mb-4">
        <div class="col">
            <h2>编辑用户</h2>
        </div>
        <div class="col text-end">
            <a href="/users" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> 返回用户列表
            </a>
        </div>
    </div>

    {% if error %}
    <div class="alert alert-danger" role="alert">
        {{ error }}
    </div>
    {% endif %}

    <div class="card">
        <div class="card-body">
            <form method="post" action="/users/{{ user.id }}/edit">
                <div class="mb-3">
                    <label for="username" class="form-label">用户名</label>
                    <input type="text" class="form-control" id="username" value="{{ user.username }}" readonly>
                    <div class="form-text">用户名不可修改</div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">电子邮箱</label>
                    <input type="email" class="form-control" id="email" name="email" value="{{ user.email }}" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">密码</label>
                    <input type="password" class="form-control" id="password" name="password">
                    <div class="form-text">留空表示不修改密码</div>
                </div>

                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="is_active" name="is_active" value="true" {% if
                        user.is_active %}checked{% endif %}>
                    <label class="form-check-label" for="is_active">账户激活</label>
                </div>

                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="is_superuser" name="is_superuser" value="true"
                        {% if user.is_superuser %}checked{% endif %}>
                    <label class="form-check-label" for="is_superuser">管理员权限</label>
                </div>

                <div class="mb-3">
                    <label for="ssh_private_key" class="form-label">SSH私钥</label>
                    <textarea class="form-control" id="ssh_private_key" name="ssh_private_key"
                        rows="5">{{ user.ssh_private_key }}</textarea>
                    <div class="form-text">用于连接服务器的SSH私钥，格式如：-----BEGIN RSA PRIVATE KEY-----...</div>
                </div>

                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> 保存修改
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
