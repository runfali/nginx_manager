{% extends "base.html" %}

{% block title %}编辑配置 - {{ config.name }}{% endblock %}

{% block content %}
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0" style="font-size: 1.5rem; font-weight: 700;">编辑配置</h2>
        <a href="/configs/browse/view/{{ config.id }}" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left me-1"></i> 返回详情
        </a>
    </div>

    {% if error %}
    <div class="alert alert-danger" role="alert">
        {{ error }}
    </div>
    {% endif %}

    <div class="card">
        <div class="card-body">
            <form method="post" action="/configs/browse/view/{{ config.id }}/edit">
                <div class="mb-3">
                    <label for="name" class="form-label">配置名称</label>
                    <input type="text" class="form-control" id="name" name="name" value="{{ config.name }}" required>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label for="environment" class="form-label">所属环境</label>
                        <select class="form-select" id="environment" name="environment" required>
                            {% for env in environments %}
                            <option value="{{ env.name }}" {% if env.id==config.environment %}selected{% endif %}>{{
                                env.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="file_path" class="form-label">文件路径</label>
                        <input type="text" class="form-control" id="file_path" name="file_path"
                            value="{{ config.file_path }}" required>
                        <div class="form-text">配置文件在服务器上的完整路径，例如：/etc/nginx/conf.d/app.conf</div>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="editor" class="form-label">配置内容</label>
                    <textarea id="editor" name="content">{{ config.content }}</textarea>
                </div>

                <div class="d-flex justify-content-end">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save me-1"></i> 保存配置
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<!-- CodeMirror JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/nginx/nginx.min.js"></script>
<!-- CodeMirror Search Addon -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/dialog/dialog.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/search/search.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/search/searchcursor.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/dialog/dialog.min.js"></script>

<script>
    // 初始化CodeMirror编辑器
    var editor = CodeMirror.fromTextArea(document.getElementById("editor"), {
        mode: "nginx",
        theme: "base16-light",
        lineNumbers: true,
        indentUnit: 4,
        lineWrapping: true,
        extraKeys: {
            "Ctrl-F": "findPersistent",
            "Cmd-F": "findPersistent"
        }
    });
</script>
{% endblock %}
