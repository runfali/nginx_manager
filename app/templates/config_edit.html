{% extends "base.html" %}

{% block title %}编辑配置 - {{ config.name }}{% endblock %}

{% block content %}
<div class="container">
    <div class="row mb-4">
        <div class="col">
            <h2>编辑配置</h2>
        </div>
        <div class="col text-end">
            <a href="/configs/{{ config.id }}" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> 返回详情
            </a>
        </div>
    </div>

    {% if error %}
    <div class="alert alert-danger" role="alert">
        {{ error }}
    </div>
    {% endif %}

    <div class="card">
        <div class="card-body">
            <form method="post" action="/configs/{{ config.id }}/edit">
                <div class="mb-3">
                    <label for="name" class="form-label">配置名称</label>
                    <input type="text" class="form-control" id="name" name="name" value="{{ config.name }}" required>
                </div>

                <div class="mb-3">
                    <label for="environment" class="form-label">所属环境</label>
                    <select class="form-select" id="environment" name="environment" required>
                        {% for env in environments %}
                        <option value="{{ env.name }}" {% if env.name==config.environment %}selected{% endif %}>{{
                            env.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label for="file_path" class="form-label">文件路径</label>
                    <input type="text" class="form-control" id="file_path" name="file_path"
                        value="{{ config.file_path }}" required>
                    <div class="form-text">配置文件在服务器上的完整路径，例如：/etc/nginx/conf.d/app.conf</div>
                </div>

                <div class="mb-3">
                    <label for="editor" class="form-label">配置内容</label>
                    <textarea id="editor" name="content" class="form-control">{{ config.content }}</textarea>
                </div>

                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> 保存配置
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<!-- CodeMirror JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/nginx/nginx.min.js"></script>

<script>
    // 初始化CodeMirror编辑器
    var editor = CodeMirror.fromTextArea(document.getElementById("editor"), {
        mode: "nginx",
        theme: "monokai",
        lineNumbers: true,
        indentUnit: 4,
        lineWrapping: true
    });
</script>
{% endblock %}
